# ============================================================
#  RCA Open WebUI - Docker Compose
#  对外端口: 9000（可在 rca.env 中通过 OPEN_WEBUI_PORT 修改）
#
#  首次使用（或 requirements 变更时）:
#    docker build -f Dockerfile.base -t rca-base:latest .
#
#  日常使用:
#    docker compose up -d --build      # 构建并启动
#    docker compose up -d              # 仅启动
#    docker compose logs -f            # 查看日志
#    docker compose down               # 停止
#
#  配置说明:
#    所有配置项在 rca.env 中管理，模板见 rca.env.example
# ============================================================

services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RCA_BASE_IMAGE: rca-base:latest
        BUILD_HASH: ${BUILD_HASH:-dev-build}
    image: rca-open-webui:latest
    container_name: rca-open-webui
    restart: unless-stopped

    # 从 rca.env 文件加载所有环境变量
    env_file:
      - rca.env

    ports:
      - "${OPEN_WEBUI_PORT:-9000}:${PORT:-9000}"

    volumes:
      # ---- 数据持久化（必须挂载） ----
      # 包含: SQLite 数据库(webui.db)、用户上传文件(uploads/)、缓存(cache/)
      - ./data:/app/backend/data

      # ---- 应用日志（必须挂载） ----
      # 每日午夜轮转，超过 1 个月的旧日志自动按月打成 .tar.gz
      - ./logs:/app/logs

      # ---- 技能文档（建议挂载，支持热更新） ----
      # 可在宿主机修改 .md 技能文档后直接生效，无需重新构建镜像
      - ./docs/skills:/app/docs/skills:ro

    extra_hosts:
      - host.docker.internal:host-gateway

    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:${PORT:-9000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
